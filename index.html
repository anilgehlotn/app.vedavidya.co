<title>Veda Vidya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#7a1f2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: single phone-width column; sticky top bar, scrolling view, fixed bottom tab bar. Maroon taken from the Parent Report. */
:root{
  --brand:#7a1f2b; --brand-2:#9b2c3b; --brand-soft:#f6e9eb; --on-brand:#ffffff;
  --bg:#f5f1f2; --surface:#ffffff; --surface-2:#faf6f7; --fg:#21161a; --muted:#6e5f63; --line:#eadfe2;
  --good:#2f7d4f; --good-soft:#e5f3ea; --warn:#b5761a; --warn-soft:#fbf0dd; --bad:#c0392b; --bad-soft:#fbe6e3;
  --gold:#c9961a; --shadow:0 1px 2px rgba(60,20,30,.06),0 4px 14px rgba(60,20,30,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#e3808e; --brand-2:#f09aa6; --brand-soft:#3a2026; --on-brand:#1b0f12;
  --bg:#141012; --surface:#1e181a; --surface-2:#251e21; --fg:#f3ecee; --muted:#ab9a9f; --line:#352a2e;
  --good:#5cc48a; --good-soft:#1b3326; --warn:#e2a64a; --warn-soft:#3a2d17; --bad:#f07264; --bad-soft:#3d1f1c;
  --gold:#e3b54a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#e3808e; --brand-2:#f09aa6; --brand-soft:#3a2026; --on-brand:#1b0f12;
  --bg:#141012; --surface:#1e181a; --surface-2:#251e21; --fg:#f3ecee; --muted:#ab9a9f; --line:#352a2e;
  --good:#5cc48a; --good-soft:#1b3326; --warn:#e2a64a; --warn-soft:#3a2d17; --bad:#f07264; --bad-soft:#3d1f1c;
  --gold:#e3b54a; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#fff;display:flex;align-items:center;gap:8px;
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-height:56px}
.topbar h1{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.brandmark{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brandmark .logo{width:32px;height:32px;border-radius:9px;background:#fff;color:#7a1f2b;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brandmark small{display:block;font-size:11px;opacity:.8;font-weight:500;letter-spacing:.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;color:#fff;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ffd166;color:#4a1018;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #7a1f2b}

#view{flex:1;padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
#view.nopad-bottom{padding-bottom:16px}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--brand)}
.tabbar button[aria-current="page"] .pill{background:var(--brand-soft)}
.tabbar .pill{padding:3px 14px;border-radius:12px;display:grid;place-items:center}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.section-h h2{font-size:16px}
.section-h .link{font-size:13px;color:var(--brand);font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--brand);color:var(--on-brand);min-height:44px}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;min-width:0}
.list-item:last-child{border-bottom:0}
.list-item .chev{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.chipbtn{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px}
.bars{display:flex;flex-direction:column;gap:10px}
.barline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.barline .lbl{font-size:13px;min-width:0}
.barline .val{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.barline .bar{grid-column:1 / -1}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* student strip */
.student{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}

/* result hero */
.result-hero{background:var(--brand);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;border:0}
.result-hero .eyebrow{color:rgba(255,255,255,.75)}
.result-hero h3{font-size:16px;color:#fff}
.result-hero .score{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.result-hero .score small{font-size:18px;opacity:.75;font-weight:600}
.result-hero .meta{display:flex;flex-wrap:wrap;gap:6px}
.result-hero .meta span{font-size:12px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:99px}
.result-hero .delta{display:inline-flex;align-items:center;gap:4px;background:#fff;color:#2f7d4f;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
:root[data-theme="dark"] .result-hero{background:#5c1a24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .result-hero{background:#5c1a24}}

.chart-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.chart-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chart svg{width:100%;height:auto;display:block}

.exam-row .pct{font-family:var(--f-display);font-weight:700;font-size:16px}

.report-card{display:flex;flex-direction:column;gap:12px}
.report-card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.report-card .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.report-card h3{font-size:15px}

/* document (report / notes) view */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.doc-head{background:var(--brand);color:#fff;padding:16px 18px}
.doc-head .eyebrow{color:rgba(255,255,255,.8)}
.doc-head h2{font-size:18px;color:#fff;margin-top:4px}
.doc-head p{font-size:13px;opacity:.85;margin-top:4px}
:root[data-theme="dark"] .doc-head{background:#5c1a24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .doc-head{background:#5c1a24}}
.doc-body{padding:18px;display:flex;flex-direction:column;gap:18px}
.doc-body h3{font-size:15px;color:var(--brand)}
.doc-body ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.doc-body li{font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.callout{background:var(--brand-soft);border-left:4px solid var(--brand);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}

.topic{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.topic.strong{border-left:4px solid var(--good)}
.topic.weak{border-left:4px solid var(--bad)}
.topic.weak.med{border-left-color:var(--warn)}
.topic h4{margin:0;font-size:14px}
.topic .action{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px}
.topic .action b{color:var(--brand)}

/* question bank */
.subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.subj .dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;font-size:15px}
.subj h3{font-size:15px}
.q{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.q p{font-size:14px}
.q .tags{display:flex;flex-wrap:wrap;gap:6px}
.q .ask{align-self:flex-start;font-size:13px;color:var(--brand);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.q .ask svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dl{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.dl b{font-size:13px}
.dl span{font-size:12px;color:var(--muted)}
.dl svg{width:20px;height:20px;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* attendance */
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:var(--f-display);font-size:26px;display:block;line-height:1}
.ring .lbl span{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr;gap:8px;flex:1;min-width:0}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.stat b{font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:600}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;max-width:100%}
.d.P{background:var(--good-soft);color:var(--good)}
.d.A{background:var(--bad);color:#fff}
.d.H{background:var(--warn-soft);color:var(--warn)}
.d.N{background:var(--surface-2);color:var(--muted)}
.d.F{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.d.today{outline:2px solid var(--brand);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.period{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.period:last-child{border-bottom:0}
.period .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.period h4{margin:0;font-size:14px}
.event{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.event:last-child{border-bottom:0}
.datebox{border-radius:12px;text-align:center;padding:6px 0;background:var(--surface-2);border:1px solid var(--line)}
.datebox b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.1}
.datebox span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.event h4{margin:0;font-size:14px}

/* dpp */
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);width:100%}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt[aria-pressed="true"] .k{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.progress-steps{display:flex;gap:4px}
.progress-steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress-steps i.on{background:var(--brand)}
.hint{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:14px}
.big-score{font-family:var(--f-display);font-size:48px;font-weight:700;line-height:1;color:var(--brand)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai b{color:var(--brand)}
.msg img{max-width:100%;border-radius:10px;display:block}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);border-top:1px solid var(--line);
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.composer input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px}
.roundbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);border:1px solid var(--line);color:var(--brand)}
.roundbtn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.roundbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.suggest{display:flex;flex-direction:column;gap:8px}
.suggest button{text-align:left;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px;display:flex;gap:10px;align-items:center}
.suggest button span.tag{margin-left:auto}

/* notifications */
.notif{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.notif.unread{border-color:var(--brand);background:var(--brand-soft)}
.notif .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--brand)}
.notif .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notif h4{margin:0;font-size:14px}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.login-hero{background:var(--brand);color:#fff;padding-block:calc(env(safe-area-inset-top,0px) + 48px) 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.login-hero .logo{width:56px;height:56px;border-radius:16px;background:#fff;color:#7a1f2b;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.login-hero h1{color:#fff;font-size:26px;margin-top:20px}
.login-hero p{opacity:.85;margin-top:6px;font-size:15px}
.login-form{margin:-28px 16px 24px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field .inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2)}
.field .inp:focus-within{border-color:var(--brand)}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:12px 14px;outline:none}
.field .eye{padding:0 12px;color:var(--muted);font-size:13px;font-weight:600}
.err{color:var(--bad);font-size:13px;font-weight:500}
.demo-hint{font-size:13px;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted)}
.demo-hint code{font-family:ui-monospace,Menlo,monospace;color:var(--fg);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

@media print{
  body::before,.topbar,.tabbar,.composer,.toast,.no-print{display:none!important}
  body,#app{background:#fff!important;color:#000}
  #view{padding:0!important}
  .doc{border:0}
  .doc-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function nav(name, params={}, opts={}){
  if(opts.root) state.stack=[{name,params}];
  else state.stack.push({name,params});
  render(); window.scrollTo(0,0);
}
function back(){ if(state.stack.length>1){ state.stack.pop(); render(); window.scrollTo(0,0);} }
const cur = () => state.stack[state.stack.length-1];

function render(){
  const app=$("#app");
  if(!state.loggedIn){ app.innerHTML = Login(); bindLogin(); return; }
  if(!state.stack.length) state.stack=[{name:"reports",params:{}}];
  const {name,params} = cur(); const scr = SCREENS[name];
  const tabId = TABS.find(t=>t.id===state.stack[0].name)?.id;
  const unread = state.notifs.filter(n=>n.unread).length;
  const isRoot = state.stack.length===1;
  app.innerHTML = `
   <header class="topbar">
     ${isRoot ? `<div class="brandmark"><div class="logo">V</div><div style="min-width:0"><h1>${esc(scr.title(params))}</h1><small>Veda Vidya Institute</small></div></div>`
              : `<button class="iconbtn" data-act="back" aria-label="Back">${svg("back")}</button><h1>${esc(scr.title(params))}</h1>`}
     <button class="iconbtn" data-act="notifs" aria-label="Notifications, ${unread} unread">${svg("bell")}${unread?`<span class="badge">${unread}</span>`:""}</button>
   </header>
   <main id="view" class="${name==="ai"?"":""}">${scr.render(params)}</main>
   <nav class="tabbar" aria-label="Main">${TABS.map(t=>`<button data-tab="${t.id}" ${t.id===tabId?'aria-current="page"':""}><span class="pill">${svg(t.ic)}</span>${t.label}</button>`).join("")}</nav>`;
  scr.after && scr.after(params);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-go],[data-act]"); if(!t) return;
  if(t.dataset.tab){ nav(t.dataset.tab,{}, {root:true}); return; }
  if(t.dataset.go){ nav(t.dataset.go, t.dataset.p?JSON.parse(t.dataset.p):{}); return; }
  const a=t.dataset.act;
  if(a==="back") back();
  else if(a==="notifs") nav("notifs");
  else if(a==="logout"){ state.loggedIn=false; store.del("vv_login"); state.stack=[]; render(); }
  else if(ACTIONS[a]) ACTIONS[a](t, e);
});

function progressChart(){
  const ex=[...EXAMS].sort((a,b)=>a.date.localeCompare(b.date));
  const W=340,H=200,L=40,R=26,T=22,B=40, lo=40, hi=100;
  const x=i=>L+i*(W-L-R)/(ex.length-1), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const me=ex.map(e=>pct(e.score,e.max)), av=ex.map(e=>e.classAvg);
  const path=a=>a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area=`${path(me)}L${x(me.length-1)},${y(lo)}L${x(0)},${y(lo)}Z`;
  const grid=[40,60,80,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}%</text>`).join("");
  const xl=ex.map((e,i)=>`<text x="${x(i)}" y="${H-22}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--fg)">${MONTHS[pd(e.date).getMonth()]}</text><text x="${x(i)}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${esc(e.subject)}</text>`).join("");
  const dots=me.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===me.length-1?5.5:4}" fill="var(--surface)" stroke="var(--brand)" stroke-width="2.5"/><text x="${x(i)}" y="${y(v)-11}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand)">${Math.round(v)}%</text>`).join("");
  const adots=av.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--muted)"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your percentage across the last ${ex.length} exams compared with the class average">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".18"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>

    const kc={Holiday:"warn",Test:"bad",Exam:"bad",PTM:"brand"};
    body=`<div class="section-h" style="margin:0"><h2>Upcoming</h2><span class="small muted">${up.filter(u=>u.k==="Holiday").length} holidays · ${up.filter(u=>u.k!=="Holiday").length} events</span></div>
    <div class="card" style="padding-block:4px">${up.map(u=>{const d=pd(u.d);return `<div class="event"><div class="datebox"><b class="num">${d.getDate()}</b><span>${MONTHS[d.getMonth()]}</span></div><div><div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px"><h4>${esc(u.t)}</h4><span class="chip ${kc[u.k]}">${u.k}</span></div><p class="small muted" style="margin-top:2px">${DOW[d.getDay()]} · ${esc(u.s)}</p></div></div>`}).join("")}</div>
    <div class="section-h"><h2>Academic plan</h2></div>
    <div class="stack">${SYLLABUS.map(([m,items])=>`<div class="card flat"><p class="eyebrow">${m}</p><ul style="margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px">${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  }
  return `<div class="seg" role="group" aria-label="Attendance view">${segs.map(([k,l])=>`<button data-act="attseg" data-v="${k}" aria-pressed="${seg===k}">${l}</button>`).join("")}</div>${body}`;
 }},
 month:{ title:p=>{const [y,m]=p.m.split("-").map(Number);return `${MONTHS_L[m-1]} ${y}`}, render(p){
  const [y,mo]=p.m.split("-").map(Number); const m=ATT.months.find(x=>x.key===p.m); const mp=pct(m.att,m.cond);
  const days=ATT.days.filter(d=>d.key.startsWith(p.m)); const first=new Date(y,mo-1,1).getDay(); const dim=new Date(y,mo,0).getDate();
  const cells=[]; for(let i=0;i<first;i++) cells.push(`<span></span>`);
  for(let d=1; d<=dim; d++){ const k=`${p.m}-${String(d).padStart(2,"0")}`; const rec=days.find(x=>x.key===k); const st=rec?rec.st:"F"; cells.push(`<span class="d ${st} ${k===ymd(TODAY)?"today":""}" title="${k}">${d}</span>`); }
  const log=days.filter(d=>d.st!=="N").reverse();
  const lbl={P:["Present","good"],A:["Absent","bad"],H:["Holiday","warn"]};
  return `<div class="card"><div class="ring-wrap"><div class="ring" style="width:96px;height:96px">${ringSvg(mp,96,10)}<div class="lbl"><div><b class="num" style="font-size:22px">${Math.round(mp)}%</b></div></div></div>
    <div class="stats"><div class="stat"><span class="muted">Conducted</span><b>${m.cond}</b></div><div class="stat"><span class="muted">Attended</span><b style="color:var(--good)">${m.att}</b></div><div class="stat"><span class="muted">Missed</span><b style="color:var(--bad)">${m.cond-m.att}</b></div></div></div></div>
   <div class="card stack"><div class="cal">${DOW.map(d=>`<span class="dow">${d[0]}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><i style="background:var(--good-soft);border:1px solid var(--good)"></i>Present</span><span><i style="background:var(--bad)"></i>Absent</span><span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>Holiday</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Sunday</span></div></div>
   <div class="section-h"><h2>Day by day</h2></div>
   <div class="card flat" style="padding-block:4px"><div class="list">${log.map(d=>`<div class="list-item"><div class="datebox" style="width:46px;flex:none"><b class="num" style="font-size:16px">${d.date.getDate()}</b><span>${DOW[d.dow]}</span></div><div class="grow"><p class="small" style="font-weight:600">${d.st==="H"?esc(d.note):d.subj.join(" · ")}</p><p class="small muted">${d.st==="H"?"No classes":`${d.subj.length} classes`}</p></div><span class="chip ${lbl[d.st][1]}">${lbl[d.st][0]}</span></div>`).join("")}</div></div>`;
 }},

 /* ---------- DPP ---------- */
 dpp:{ title:()=> "Daily Practice (DPP)", render(){
  const D=DPP_TODAY, done=state.dpp.completed; const hist=DPP_HISTORY;
  const comp=hist.filter(h=>h.done).length;
  return `<div class="card flat"><p class="eyebrow">Built from your weak topics</p><p class="small" style="margin-top:6px">Your daily questions come from the weak topics in your <b>Faculty Report</b> for the Physics Unit Test (30 Oct). Each topic stays in your DPP until it turns strong.</p></div>
  <div class="card stack" style="border-color:var(--brand)">
    <div class="row" style="justify-content:space-between"><span class="chip brand">Today · Day ${D.day} of ${D.of}</span>${done?`<span class="chip good">Completed</span>`:`<span class="chip warn">Pending</span>`}</div>
    <h3 style="font-size:17px">${esc(D.title)}</h3>
    <p class="small muted">${D.qs.length} questions · about 10 minutes · topics: Upthrust, Spring balance, Nature of force, Net force</p>
    <div class="progress-steps">${Array.from({length:D.of},(_,i)=>`<i class="${i<D.day-(done?0:1)?"on":""}"></i>`).join("")}</div>
    ${done?`<div class="row"><div class="big-score num" style="font-size:32px">${state.dpp.score}/${D.qs.length}</div><button class="btn ghost" style="margin-left:auto" ${go("dppResult")}>Review answers</button></div>`:`<button class="btn block" data-act="dppstart">Start today's DPP</button>`}
  </div>
  <div class="section-h"><h2>Weak topic progress</h2></div>
  <div class="card stack">${DPP_TOPICS.map(t=>{const last=t.hist[t.hist.length-1]; const st={weak:["Weak","bad"],improving:["Improving","warn"],strong:["Now strong","good"]}[t.status];return `<div class="stack-sm"><div class="row" style="justify-content:space-between;gap:8px"><p style="font-weight:600;font-size:14px" class="grow">${esc(t.t)}</p><span class="chip ${st[1]}">${st[0]}</span></div>
    <div class="bar"><i style="width:${last}%;background:${toneColor(last)}"></i></div><p class="small muted num">${t.hist.map(h=>h+"%").join(" → ")}</p></div>`}).join("")}</div>
  <div class="section-h"><h2>DPP history</h2><span class="small muted">${comp} of ${hist.length} completed</span></div>
  <div class="card flat" style="padding-block:4px"><div class="list">${hist.map(h=>`<div class="list-item"><div class="datebox" style="width:52px;flex:none;padding:6px 2px"><b class="num" style="font-size:15px">${h.d.split(" ")[0]}</b><span>${h.d.split(" ")[1]}</span></div><div class="grow"><p class="small" style="font-weight:600">${esc(h.t)}</p><p class="small muted num">${h.done?`Score ${h.s}/${h.of}`:"Not attempted"}</p></div><span class="chip ${h.done?"good":"bad"}">${h.done?"Completed":"Not completed"}</span></div>`).join("")}</div></div>`;
 }},
 dppQuiz:{ title:()=> "Today's DPP", render(){
  const D=DPP_TODAY, s=state.dpp, i=s.i, q=D.qs[i]; const sel=s.answers[i];
  return `<div class="progress-steps">${D.qs.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
   <div class="row" style="justify-content:space-between"><span class="small muted">Question ${i+1} of ${D.qs.length}</span><span class="chip brand">${esc(q.topic)}</span></div>
   <h2 style="font-size:18px;line-height:1.4">${esc(q.q)}</h2>
   <div class="stack-sm">${q.o.map((o,k)=>`<button class="opt" data-act="dppopt" data-v="${k}" aria-pressed="${sel===k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
   ${s.showHint?`<div class="hint"><b>Hint:</b> ${esc(q.hint)}</div>`:`<button class="btn ghost" data-act="dpphint">${svg("bulb")} Show hint</button>`}
   <div class="btn-row">${i>0?`<button class="btn ghost" data-act="dppprev">Previous</button>`:`<span></span>`}<button class="btn" data-act="dppnext" ${sel===undefined?'aria-disabled="true" style="opacity:.5"':""}>${i===D.qs.length-1?"Submit":"Next"}</button></div>`;
 }},
 dppResult:{ title:()=> "DPP Result", render(){
  const D=DPP_TODAY, s=state.dpp;
  return `<div class="card" style="text-align:center"><p class="eyebrow">${esc(D.title)}</p><div class="big-score num" style="margin-top:8px">${s.score}/${D.qs.length}</div><p class="small muted" style="margin-top:6px">${s.score>=5?"Excellent work! Upthrust is getting stronger.":s.score>=3?"Good effort. Read the solutions below for the ones you missed.":"Keep going. Go through each solution and try again tomorrow."}</p></div>
   <div class="section-h"><h2>Solutions</h2></div>
   ${D.qs.map((q,i)=>{const ok=s.answers[i]===q.a;return `<div class="card stack-sm"><div class="row" style="justify-content:space-between"><span class="small muted">Q${i+1} · ${esc(q.topic)}</span><span class="chip ${ok?"good":"bad"}">${ok?"Correct":"Incorrect"}</span></div><p style="font-weight:600;font-size:14px">${esc(q.q)}</p>
     ${!ok&&s.answers[i]!==undefined?`<div class="opt wrong" style="padding:10px"><span class="k">${"ABCD"[s.answers[i]]}</span><span class="small">Your answer: ${esc(q.o[s.answers[i]])}</span></div>`:""}
     <div class="opt right" style="padding:10px"><span class="k">${"ABCD"[q.a]}</span><span class="small">${esc(q.o[q.a])}</span></div>
     <p class="small"><b>Solution:</b> ${esc(q.sol)}</p>
     <button class="ask" style="font-size:13px;color:var(--brand);font-weight:600;align-self:flex-start;display:inline-flex;gap:6px;align-items:center" data-act="askq" data-q="${esc(q.q)}">${svg("spark").replace('class=""','style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2"')} Ask AI to explain</button></div>`}).join("")}
   <button class="btn block" data-tab="dpp">Back to DPP</button>`;
 }},

 /* ---------- AI ---------- */
 ai:{ title:()=> "Ask AI", render(){
  const subs=["All","Physics","Chemistry","Biology","Maths"];
  const sug=AI_SUGGEST.filter(s=>state.aiSubj==="All"||s.subj===state.aiSubj);
  const msgs=state.chat.map(m=>m.typing?`<div class="msg ai"><span class="typing"><i></i><i></i><i></i></span></div>`:`<div class="msg ${m.me?"me":"ai"}">${m.img?`<img src="${m.img}" alt="Uploaded question photo">`:""}${m.me?esc(m.t):m.t.replace(/\n/g,"<br>")}</div>`).join("");
  return `<div class="card flat row"><div class="ic" style="width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none">${svg("spark").replace('class=""','style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2"')}</div><div class="grow"><h3 style="font-size:15px">Veda Vidya AI Tutor</h3><p class="small muted">Answers from your class notes and question bank. Gives hints first, so you learn to solve it yourself.</p></div></div>
   <div class="hscroll" role="group" aria-label="Subject">${subs.map(s=>`<button class="chipbtn" data-act="aisubj" data-v="${s}" aria-pressed="${state.aiSubj===s}">${s}</button>`).join("")}</div>
   <div class="chat" id="chat">${msgs || `<div class="msg ai">Hi ${STUDENT.first}! 👋 Ask me any doubt from your notes or question bank. Tap a suggested question below to try.</div>`}</div>
   <div class="stack-sm"><p class="eyebrow">Suggested questions</p><div class="suggest">${sug.map(s=>`<button data-act="aisug" data-q="${esc(s.q)}">${svg("spark").replace('class=""','style="width:16px;height:16px;flex:none;fill:none;stroke:var(--brand);stroke-width:2"')}<span>${esc(s.q)}</span><span class="tag chip">${s.subj}</span></button>`).join("")}</div></div>
   <div style="height:64px"></div>
   <form class="composer" id="composer"><label class="roundbtn" for="photo" title="Upload a photo of a question">${svg("camera")}<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Upload photo</span></label><input type="file" id="photo" accept="image/*" hidden>
    <input type="text" id="ask" placeholder="Type your doubt…" autocomplete="off" aria-label="Type your doubt"><button class="roundbtn primary" type="submit" aria-label="Send">${svg("send")}</button></form>`;
 }, after(){
  $("#composer").onsubmit=e=>{e.preventDefault(); const v=$("#ask").value.trim(); if(v) askAI(v);};
  $("#photo").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ state.chat.push({me:true,t:"Can you help me with this question?",img:r.result}); replyAI("📷 I can see your question. <b>Hint 1:</b> First underline what is given and what is asked. <b>Hint 2:</b> Find the chapter it belongs to and recall its main formula or idea.\n\nIn the full app, I'll read the question from your photo and walk you through it step by step."); }; r.readAsDataURL(f); };
  const c=$("#chat"); if(state.chat.length) c.lastElementChild?.scrollIntoView({block:"end"});
 }},

 /* ---------- NOTIFICATIONS ---------- */
 notifs:{ title:()=> "Notifications", render(){
  const unread=state.notifs.filter(n=>n.unread).length;
  return `<div class="row" style="justify-content:space-between"><p class="small muted">${unread?`${unread} unread`:"All caught up"}</p>${unread?`<button class="small" style="color:var(--brand);font-weight:600" data-act="readall">Mark all as read</button>`:""}</div>
   <div class="stack-sm">${state.notifs.map(n=>`<button class="notif ${n.unread?"unread":""}" data-act="opennotif" data-id="${n.id}"><span class="ic">${svg(n.ic)}</span><div class="grow"><h4>${esc(n.t)}</h4><p class="small muted">${esc(n.s)}</p><p class="small muted" style="margin-top:4px;font-size:12px">${n.w}</p></div></button>`).join("")}</div>`;
 }}
};

const NOTE_TYPES = { summary:{label:"Summary Notes",d:"One-page overview"}, points:{label:"Important Points",d:"Key facts to remember"}, revision:{label:"Revision Notes",d:"Formulas and quick recall"}, qbank:{label:"Question Bank",d:"All PYQs with years"} };
function dlGrid(s,c){ return `<div class="dl-grid">${Object.entries(NOTE_TYPES).map(([k,v])=>`<button class="dl" ${go("notes",{s,c,t:k})}>${svg("download")}<b>${v.label}</b><span>${v.d}</span></button>`).join("")}</div>`; }
function qCard(q,s,c,showSrc){
  const rep=q.y.length;
  return `<div class="q"><p>${esc(q.q)}</p><div class="tags"><span class="chip">${q.m} mark${q.m>1?"s":""}</span>${rep>1?`<span class="chip warn">Repeated ${rep}×</span>`:""}${q.imp?`<span class="chip brand">★ Important</span>`:""}<span class="chip">${q.y.join(" · ")}</span>${showSrc?`<span class="chip">${s.name} · Ch ${c.n}</span>`:""}</div>
   <button class="ask" data-act="askq" data-q="${esc(q.q)}" data-s="${s.id}" data-c="${c.n}">${svg("spark")} Ask AI for a hint</button></div>`;
}
function reportCards(id){
  return `<div class="card report-card"><div class="row"><div class="ic" style="background:var(--brand-soft);color:var(--brand)">${svg("users")}</div><div class="grow"><h3>Parent Report</h3><p class="small muted">Result summary and how to help at home</p></div></div>
     <div class="btn-row"><button class="btn ghost" ${go("parentReport",{id})}>${svg("eye")} View</button><button class="btn" data-act="download" data-kind="parent" data-id="${id}">${svg("download")} Download</button></div></div>
   <div class="card report-card"><div class="row"><div class="ic" style="background:var(--warn-soft);color:var(--warn)">${svg("report")}</div><div class="grow"><h3>Faculty Report</h3><p class="small muted">Strong and weak topics, and the faculty's action plan for ${STUDENT.first}</p></div></div>
     <div class="btn-row"><button class="btn ghost" ${go("facultyReport",{id})}>${svg("eye")} View</button><button class="btn" data-act="download" data-kind="faculty" data-id="${id}">${svg("download")} Download</button></div></div>`;
}

/* ============================== ACTIONS ============================== */
function askAI(text, s, c){
  state.chat.push({me:true,t:text});
  const m=AI_SUGGEST.find(x=>x.q===text);
  if(m) return replyAI(m.a);
  const sub=s&&SUBJECTS.find(x=>x.id===s), ch=sub&&sub.chapters.find(x=>x.n===+c);
  if(ch) return replyAI(`Let's think it through step by step.\n\n<b>Hint 1:</b> This question is from <b>${esc(sub.name)} · Ch ${ch.n} · ${esc(ch.name)}</b>. Start with the key idea: ${esc(ch.points[0])}\n\n<b>Hint 2:</b> ${esc(ch.points[1])}\n\n${ch.formulas.length?`<b>Useful formula:</b> ${esc(ch.formulas[0])}\n\n`:""}Now try writing your answer using these hints. Send it to me and I'll check it.`);
  replyAI(`Good question! <b>Hint:</b> First find which chapter this belongs to, then recall its main idea or formula.\n\nIn the full app, I'll answer any doubt like this from your Veda Vidya notes, step by step. For this demo, try one of the suggested questions below.`);
}
function replyAI(html){
  state.chat.push({typing:true}); if(cur().name==="ai") render(); else nav("ai",{},{root:true});
  setTimeout(()=>{ state.chat=state.chat.filter(m=>!m.typing); state.chat.push({t:html}); if(cur().name==="ai") render(); }, 1100);
}
const ACTIONS = {
  download(t){
    const k=t.dataset.kind;
    const label={parent:"Parent Report",faculty:"Faculty Report",wellbeing:"Wellbeing Report",notes:t.dataset.label}[k];
    const target={parent:["parentReport",{id:t.dataset.id}],faculty:["facultyReport",{id:t.dataset.id}],wellbeing:["wellbeing",{}]}[k];
    if(target && cur().name!==target[0]) nav(target[0],target[1]);
    toast(`Preparing ${label} PDF…`);
    setTimeout(()=>{ try{ window.print(); }catch(e){} }, 400);
  },
  qbtab(t){ state.qbTab=t.dataset.v; render(); },
  attseg(t){ cur().params={...cur().params,seg:t.dataset.v}; state.attSeg=t.dataset.v; render(); },
  ttday(t){ state.ttDay=+t.dataset.v; render(); },
  dppstart(){ state.dpp={answers:{},i:0,showHint:false,submitted:false,completed:false}; nav("dppQuiz"); },
  dppopt(t){ state.dpp.answers[state.dpp.i]=+t.dataset.v; render(); },
  dpphint(){ state.dpp.showHint=true; render(); },
  dppprev(){ state.dpp.i--; state.dpp.showHint=false; render(); },
  dppnext(){ const s=state.dpp; if(s.answers[s.i]===undefined){ toast("Choose an answer first."); return; }
    if(s.i<DPP_TODAY.qs.length-1){ s.i++; s.showHint=false; render(); window.scrollTo(0,0); return; }
    s.score=DPP_TODAY.qs.reduce((a,q,i)=>a+(s.answers[i]===q.a?1:0),0); s.completed=true;
    if(!DPP_HISTORY.find(h=>h.today)) DPP_HISTORY.unshift({d:"21 Nov",t:DPP_TODAY.title,s:s.score,of:DPP_TODAY.qs.length,done:true,today:true});
    state.stack=[{name:"dpp",params:{}},{name:"dppResult",params:{}}]; render(); window.scrollTo(0,0); toast("DPP submitted"); },
  aisubj(t){ state.aiSubj=t.dataset.v; render(); },
  aisug(t){ askAI(t.dataset.q); },
  askq(t){ askAI(t.dataset.q, t.dataset.s, t.dataset.c); },
  readall(){ state.notifs.forEach(n=>n.unread=false); render(); },
  opennotif(t){ const n=state.notifs.find(x=>x.id===+t.dataset.id); n.unread=false; const [name,p]=n.go; if(name==="attendance"){ state.attSeg=p.seg||"overview"; } nav(name,p); }
};

render();
</script>
