<style>
/* Layout: phone-width column, soft off-white ground, pastel rounded tiles, floating dark pill nav. Single light look, following the reference design. */
:root{
  color-scheme:light;
  --bg:#f4f3f8; --surface:#ffffff; --ink:#111118; --ink-2:#2b2b35; --muted:#7c7b88; --line:#eceaf2;
  --lav:#b7a6ff; --lav-2:#cfc3ff; --green:#b6ebb1; --cyan:#b0e9f1; --orange:#fdc46a; --blue:#a8c6ff; --pink:#f4a9ee; --yellow:#ffe58a;
  --good:#1d8a4b; --good-soft:#dcf4e2; --warn:#b06d00; --warn-soft:#fff0d3; --bad:#d4433f; --bad-soft:#fde3e1;
  --brand:#7a1f2b;
  --f:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
h1,h2,h3,h4{margin:0;font-weight:500;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;
  padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr .mid{text-align:center;min-width:0}
.hdr .mid b{display:block;font-size:19px;font-weight:500}
.hdr .mid span{font-size:14px;color:var(--ink-2)}
.hdr h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative}
.circ.plain{background:transparent;border-color:transparent}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:17px;color:var(--ink);
  background:conic-gradient(from 200deg,var(--orange),var(--pink),var(--lav),var(--cyan),var(--orange));position:relative}
.avatar::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#ffe9c4;z-index:0}
.avatar span{position:relative;z-index:1}
.avatar.xl{width:84px;height:84px;font-size:26px}
.dotbadge{position:absolute;top:10px;right:11px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

#view{flex:1;padding-block:6px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}

/* floating nav */
.nav{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:448px;
  background:var(--ink);border-radius:999px;padding:6px;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;box-shadow:0 10px 30px rgba(17,17,24,.25)}
.nav button{height:54px;display:grid;place-items:center;color:#fff;border-radius:999px}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink)}
.nav button .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* type */
.h-lg{font-size:28px;font-weight:500;letter-spacing:-.02em}
.h-md{font-size:20px;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{font-size:24px;font-weight:500;letter-spacing:-.02em}
.sec .aside{font-size:14px;color:var(--muted)}

/* surfaces */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;min-width:0}
.tile{border-radius:var(--r-lg);padding:18px;min-width:0;color:var(--ink);display:flex;flex-direction:column;gap:6px;text-align:left;position:relative;overflow:hidden}
.t-lav{background:var(--lav)} .t-green{background:var(--green)} .t-cyan{background:var(--cyan)} .t-orange{background:var(--orange)} .t-blue{background:var(--blue)} .t-pink{background:var(--pink)} .t-yellow{background:var(--yellow)} .t-white{background:var(--surface)}
.tag{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.55);white-space:nowrap}
.tag.solid{background:var(--surface)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.dark{background:var(--ink);color:#fff}

/* hero (daily-challenge style) */
.hero{background:var(--lav);border-radius:var(--r-xl);padding:22px;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;gap:10px}
.hero h2{font-size:36px;line-height:1.02;font-weight:600;letter-spacing:-.03em;max-width:66%}
.hero .sub{font-size:14.5px;max-width:66%}
.hero .score{font-size:44px;font-weight:600;line-height:1;letter-spacing:-.03em}
.hero .score small{font-size:20px;font-weight:500;opacity:.7}
.hero .deco{position:absolute;right:-18px;top:18px;width:46%;max-width:190px;aspect-ratio:1;pointer-events:none}

/* day/exam pills */
.pills{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.pill{border:1.5px solid #d9d7e2;border-radius:999px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:14px;position:relative;min-width:0}
.pill b{font-weight:500;color:var(--ink-2);font-size:16px}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);margin-bottom:4px}
.pill .dot.off{background:transparent}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#d9d7e2}
.pill[aria-pressed="true"] b{color:#fff}
.pill[aria-pressed="true"] .dot{background:#fff}

/* plan-style grid */
.plan{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto;gap:12px}
.plan .tall{grid-row:span 2;min-height:300px}
.plan .tile h3{font-size:24px;font-weight:500;line-height:1.1;margin-top:10px}
.plan .tile .meta{font-size:14px;line-height:1.65;margin-top:6px}
.plan .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:12px}
.rbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.6);flex:none}
.rbtn.dark{background:var(--ink);color:#fff}
.rbtn.white{background:var(--surface)}
.rbtn svg.i{width:20px;height:20px}

/* stat tiles */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 .tile{padding:14px 12px;gap:2px;border-radius:20px}
.stat3 .k{font-size:13.5px}
.stat3 .v{font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.stat3 .v small{font-size:15px;font-weight:400}

/* list rows (profile style) */
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:16px;padding:16px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-width:0}
.rowi:last-child{border-bottom:0}
.rowi .ic{width:28px;display:grid;place-items:center;flex:none;color:var(--ink)}
.rowi h4{font-size:17px;font-weight:500}
.rowi p{font-size:14px;color:var(--muted);margin-top:1px}
.rowi .chev{color:var(--ink)}
.rowi .end{text-align:right;flex:none}

/* bars */
.bar{height:8px;border-radius:99px;background:#efedf4;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px}
.bars{display:flex;flex-direction:column;gap:12px}
.barline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center}
.barline .lbl{font-size:14px;min-width:0}
.barline .val{font-size:14px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.barline .bar{grid-column:1 / -1}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:999px;padding:5px;gap:4px}
.seg button{padding:11px 6px;border-radius:999px;font-size:14px;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;padding:9px 16px;border-radius:999px;border:1.5px solid #d9d7e2;font-size:14px;color:var(--ink-2)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 20px;border-radius:999px;font-weight:500;font-size:15px;background:var(--ink);color:#fff;min-height:52px}
.btn.light{background:var(--surface);color:var(--ink)}
.btn.block{width:100%}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* docs */
.doc{background:var(--surface);border-radius:var(--r-xl);overflow:hidden}
.doc-head{padding:22px}
.doc-head .eyebrow{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.doc-head h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.doc-head p{font-size:14px;margin-top:6px}
.doc-body{padding:20px;display:flex;flex-direction:column;gap:20px}
.doc-body h3{font-size:18px;font-weight:600}
.doc-body ul,.doc-body ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.doc-body li{font-size:14.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.callout{background:var(--bg);border-radius:16px;padding:14px 16px;font-size:14.5px}
.tbl-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.topic{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.topic h4{font-size:16px;font-weight:600}
.topic .action{background:rgba(255,255,255,.7);border-radius:12px;padding:10px 12px;font-size:14px}

/* questions */
.q{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q p{font-size:15px}
.q .tags{display:flex;flex-wrap:wrap;gap:6px}
.q .tags .tag{background:var(--bg)}
.q .tags .tag.warn{background:var(--warn-soft)} .q .tags .tag.lav{background:var(--lav-2)}
.linkbtn{font-size:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center;align-self:flex-start;border-bottom:1.5px solid var(--ink);padding-bottom:1px}
.linkbtn svg.i{width:16px;height:16px}

/* attendance */
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:30px;font-weight:600;display:block;line-height:1;letter-spacing:-.02em}
.ring .lbl span{font-size:12px;color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:12px;text-align:center;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums;max-width:100%}
.d.P{background:var(--green)} .d.A{background:var(--bad);color:#fff} .d.H{background:var(--orange)} .d.N{background:var(--bg);color:var(--muted)} .d.F{color:#c9c7d2}
.d.today{outline:2px solid var(--ink);outline-offset:2px}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.keys i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.period{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.period .time{font-size:13px;color:var(--ink-2);line-height:1.5;font-variant-numeric:tabular-nums;width:74px}
.datebox{width:52px;border-radius:16px;text-align:center;padding:8px 0;background:var(--bg);flex:none}
.datebox b{display:block;font-size:19px;font-weight:600;line-height:1.1}
.datebox span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* dpp */
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:16px;border-radius:20px;background:var(--surface);border:2px solid transparent;width:100%}
.opt .k{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:#fff}
.opt.right{background:var(--green)} .opt.wrong{background:var(--bad-soft)}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:6px;border-radius:3px;background:rgba(17,17,24,.12)}
.steps i.on{background:var(--ink)}
.hint{background:var(--yellow);border-radius:18px;padding:14px 16px;font-size:14.5px}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:12px 16px;border-radius:22px;font-size:15px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:fixed;z-index:24;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;border:0;background:var(--surface);border-radius:999px;padding:16px 20px;box-shadow:0 4px 18px rgba(17,17,24,.08);outline:none}
.composer .rbtn{width:52px;height:52px}

/* notifications */
.notif{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;background:var(--surface);text-align:left;width:100%}
.notif .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.notif h4{font-size:16px;font-weight:500}
.notif .new{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none;margin-top:6px}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:calc(env(safe-area-inset-top,0px) + 24px) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .hero{min-height:280px;justify-content:flex-end}
.login .hero h2{font-size:40px;max-width:80%}
.logo{width:56px;height:56px;border-radius:18px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500;padding-left:6px}
.field .inp{display:flex;align-items:center;background:var(--surface);border-radius:999px;border:2px solid transparent}
.field .inp:focus-within{border-color:var(--ink)}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:15px 20px;outline:none}
.field .eye{padding:0 18px;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:14px;padding-left:6px}
.demo-hint{font-size:14px;text-align:center;color:var(--muted)}
.demo-hint code{font-family:ui-monospace,Menlo,monospace;color:var(--ink);background:var(--surface);padding:2px 8px;border-radius:8px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.hero h2{font-size:30px}.plan{grid-template-columns:1fr}.plan .tall{grid-row:auto;min-height:0}.stat3 .v{font-size:21px}}
@media print{body::before,.hdr,.nav,.composer,.toast,.no-print{display:none!important}#view{padding:0!important}body{background:#fff}.doc-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

  for(const d of days){
    const mk=d.key.slice(0,7); months[mk] ??= {key:mk,cond:0,att:0,holidays:0};

  return {days, months:ml, subj, cond, att};
})();

function nav(name, params={}, opts={}){
  if(opts.root) state.stack=[{name,params}]; else state.stack.push({name,params});
  render(); window.scrollTo(0,0);
}
function back(){ if(state.stack.length>1){ state.stack.pop(); render(); window.scrollTo(0,0);} }
const cur = () => state.stack[state.stack.length-1];

function render(){
  const app=$("#app");
  if(!state.loggedIn){ app.innerHTML = Login(); bindLogin(); return; }
  if(!state.stack.length) state.stack=[{name:"reports",params:{}}];
  const {name,params} = cur(); const scr = SCREENS[name];
  const tabId = state.stack[0].name;

  scr.after && scr.after(params);
}

function progressChart(){
  const ex=[...EXAMS].sort((a,b)=>a.date.localeCompare(b.date));
  const W=340,H=200,L=40,R=26,T=24,B=40, lo=40, hi=100;
  const x=i=>L+i*(W-L-R)/(ex.length-1), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const me=ex.map(e=>pct(e.score,e.max)), av=ex.map(e=>e.classAvg);
  const path=a=>a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area=`${path(me)}L${x(me.length-1)},${y(lo)}L${x(0)},${y(lo)}Z`;
  const grid=[40,60,80,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eceaf2" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#7c7b88">${v}%</text>`).join("");
  const xl=ex.map((e,i)=>`<text x="${x(i)}" y="${H-22}" text-anchor="middle" font-size="11" font-weight="500" fill="#111118">${MONTHS[pd(e.date).getMonth()]}</text><text x="${x(i)}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="#7c7b88">${esc(e.subject)}</text>`).join("");
  const dots=me.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${ex[i].id===state.examId?6.5:4.5}" fill="${ex[i].id===state.examId?"#111118":"#fff"}" stroke="#111118" stroke-width="2.5"/><text x="${x(i)}" y="${y(v)-12}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111118">${Math.round(v)}%</text>`).join("");
  const adots=av.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#a99bf5"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your percentage across the last ${ex.length} exams compared with the class average">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7a6ff" stop-opacity=".45"/><stop offset="1" stop-color="#b7a6ff" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ga)"/><path d="${path(av)}" fill="none" stroke="#a99bf5" stroke-width="2" stroke-dasharray="5 4"/>${adots}
    <path d="${path(me)}" fill="none" stroke="#111118" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}
function docHead(tile,eyebrow,title,sub){ return `<div class="doc-head ${tile}"><p class="eyebrow">${eyebrow}</p><h2>${title}</h2><p>${sub}</p></div>`; }
function dlBtn(kind,label,extra=""){ return `<button class="btn block no-print" data-act="download" data-kind="${kind}" ${extra}>${svg("download")} Download ${label} (PDF)</button>`; }

/* academics helpers */
const getCh = (s,c) => { const S=SUBJECTS.find(x=>x.id===s); return [S, S.chapters.find(x=>x.n===+c)]; };
function modulesOf(c){
  const m=[{t:"Introduction",d:"What this chapter is about",items:[c.summary]},{t:"Key concepts",d:`${c.points.length} concepts explained`,items:c.points}];
  if(c.formulas.length) m.push({t:"Formulas and rules",d:`${c.formulas.length} to remember`,items:c.formulas});
  m.push({t:"Practice: important questions",d:`${c.qs.filter(q=>q.imp).length} questions`,items:c.qs.filter(q=>q.imp).map(q=>q.q)});
  return m;
}
function qCard(q,s,c,showSrc){
  const rep=q.y.length;
  return `<div class="q"><p>${esc(q.q)}</p><div class="tags"><span class="tag">${q.m} mark${q.m>1?"s":""}</span>${rep>1?`<span class="tag warn">Repeated ${rep}×</span>`:""}${q.imp?`<span class="tag lav">★ Important</span>`:""}<span class="tag">${q.y.join(" · ")}</span>${showSrc?`<span class="tag">${s.name} · Ch ${c.n}</span>`:""}</div>
   <button class="linkbtn" data-act="askq" data-q="${esc(q.q)}" data-s="${s.id}" data-c="${c.n}">${svg("spark")} Ask AI for a hint</button></div>`;
}

    body=`<div class="hero" style="background:var(--green);min-height:0;flex-direction:row;align-items:center;gap:18px">
      <div class="ring">${ringSvg(ATT_PCT)}<div class="lbl"><div><b class="num">${ATT_PCT}%</b><span>overall</span></div></div></div>
      <div class="grow"><h2 style="font-size:26px;max-width:none">Excellent attendance</h2><p class="small" style="margin-top:6px">Minimum required is 75%. ${absentDays} days absent since June.</p></div></div>
     <div class="stat3"><div class="tile t-cyan"><span class="k">Conducted</span><span class="v num">${ATT.cond}</span></div><div class="tile t-lav"><span class="k">Attended</span><span class="v num">${ATT.att}</span></div><div class="tile t-orange"><span class="k">Missed</span><span class="v num">${ATT.cond-ATT.att}</span></div></div>
     <div class="sec"><h2>Monthly</h2><span class="aside">Tap for calendar</span></div>
     <div class="card" style="padding-block:4px"><div class="rows">${[...ATT.months].reverse().map(m=>{const mp=pct(m.att,m.cond);const [y,mo]=m.key.split("-").map(Number);
       return `<button class="rowi" ${go("month",{m:m.key})}><span class="datebox"><b class="num" style="font-size:16px">${MONTHS[mo-1]}</b><span>${y}</span></span><div class="grow"><div class="row" style="justify-content:space-between"><h4>${Math.round(mp)}%</h4><span class="small muted num">${m.att}/${m.cond} classes</span></div><div class="bar" style="margin-top:8px"><i style="width:${mp}%;background:var(--ink)"></i></div></div><span class="chev">${svg("chev")}</span></button>`}).join("")}</div></div>
     <div class="sec"><h2>Subject-wise</h2></div>
     <div class="card"><div class="bars">${Object.entries(ATT.subj).map(([s,v])=>barLine(s,v.att,v.cond,"var(--ink)",`${v.att}/${v.cond} · ${Math.round(pct(v.att,v.cond))}%`)).join("")}</div></div>`;
  } else if(seg==="timetable"){
    const dsel=state.ttDay ?? (TODAY.getDay()||1);
    const weekStart=new Date(TODAY); weekStart.setDate(TODAY.getDate()-TODAY.getDay());
    const tiles={Physics:"t-lav",Maths:"t-cyan",Chemistry:"t-orange",Biology:"t-green","Doubt Session":"t-pink"};
    body=`<div class="pills" role="group" aria-label="Day">${[1,2,3,4,5,6].map(d=>{const dt=new Date(weekStart);dt.setDate(weekStart.getDate()+d);return `<button class="pill" data-act="ttday" data-v="${d}" aria-pressed="${d===dsel}"><span class="dot ${d===TODAY.getDay()?"":"off"}"></span>${DOW[d]}<b class="num">${dt.getDate()}</b></button>`}).join("")}</div>
     <div class="sec"><h2>${DOW[dsel]==="Sat"&&dsel===TODAY.getDay()?"Today's classes":`${["","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dsel]}`}</h2><span class="aside">3 classes</span></div>
     <div class="stack">${TIMETABLE[dsel].map((s,i)=>`<div class="tile ${tiles[s]}"><div class="row" style="justify-content:space-between"><span class="tag">${TIMES[i]}</span><span class="tag">Room ${["201","204","Lab 1"][i]}</span></div><h3 style="font-size:24px;margin-top:6px">${s}</h3><div class="row" style="gap:8px"><span class="avatar" style="width:32px;height:32px;font-size:11px"><span>${TEACHERS[s].split(" ").slice(-1)[0][0]}</span></span><span class="small">Faculty · ${TEACHERS[s]}</span></div></div>`).join("")}</div>`;
  } else {
    const up=UPCOMING.filter(u=>pd(u.d)>TODAY);
    const kt={Holiday:"t-orange",Test:"t-lav",Exam:"t-pink",PTM:"t-green"};
    body=`<div class="sec"><h2>Upcoming</h2><span class="aside">${up.filter(u=>u.k==="Holiday").length} holidays · ${up.filter(u=>u.k!=="Holiday").length} events</span></div>
     <div class="card" style="padding-block:4px"><div class="rows">${up.map(u=>{const d=pd(u.d);return `<div class="rowi"><span class="datebox ${kt[u.k]}"><b class="num">${d.getDate()}</b><span style="color:var(--ink-2)">${MONTHS[d.getMonth()]}</span></span><div class="grow"><h4>${esc(u.t)}</h4><p>${DOW[d.getDay()]} · ${esc(u.s)}</p></div><span class="tag" style="background:var(--bg)">${u.k}</span></div>`}).join("")}</div></div>
     <div class="sec"><h2>Academic plan</h2></div>
     <div class="stack">${SYLLABUS.map(([m,items],i)=>`<div class="tile ${["t-lav","t-cyan","t-green","t-pink"][i]}"><span class="tag">${m}</span><ul style="margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px">${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  }
  return `<div class="seg" role="group" aria-label="Attendance view">${[["overview","Overview"],["timetable","Timetable"],["plan","Holidays"]].map(([k,l])=>`<button data-act="attseg" data-v="${k}" aria-pressed="${seg===k}">${l}</button>`).join("")}</div>${body}`;

 month:{ title:p=>{const [y,m]=p.m.split("-").map(Number);return `${MONTHS_L[m-1]} ${y}`}, render(p){
  const [y,mo]=p.m.split("-").map(Number); const m=ATT.months.find(x=>x.key===p.m); const mp=Math.round(pct(m.att,m.cond));
  const days=ATT.days.filter(d=>d.key.startsWith(p.m)); const first=new Date(y,mo-1,1).getDay(); const dim=new Date(y,mo,0).getDate();
  const cells=[]; for(let i=0;i<first;i++) cells.push(`<span></span>`);
  for(let d=1; d<=dim; d++){ const k=`${p.m}-${String(d).padStart(2,"0")}`; const rec=days.find(x=>x.key===k); cells.push(`<span class="d ${rec?rec.st:"F"} ${k===ymd(TODAY)?"today":""}">${d}</span>`); }
  const log=days.filter(d=>d.st!=="N").reverse(); const lbl={P:["Present","good"],A:["Absent","bad"],H:["Holiday","warn"]};
  return `<div class="stat3"><div class="tile t-green"><span class="k">Attendance</span><span class="v num">${mp}%</span></div><div class="tile t-cyan"><span class="k">Attended</span><span class="v num">${m.att}<small>/${m.cond}</small></span></div><div class="tile t-orange"><span class="k">Missed</span><span class="v num">${m.cond-m.att}</span></div></div>
   <div class="card stack"><div class="cal">${DOW.map(d=>`<span class="dow">${d[0]}</span>`).join("")}${cells.join("")}</div>
    <div class="keys"><span><i style="background:var(--green)"></i>Present</span><span><i style="background:var(--bad)"></i>Absent</span><span><i style="background:var(--orange)"></i>Holiday</span><span><i style="background:var(--bg);border:1px solid var(--line)"></i>Sunday</span></div></div>
   <div class="sec"><h2>Day by day</h2></div>
   <div class="card" style="padding-block:4px"><div class="rows">${log.map(d=>`<div class="rowi"><span class="datebox"><b class="num" style="font-size:16px">${d.date.getDate()}</b><span>${DOW[d.dow]}</span></span><div class="grow"><h4 style="font-size:15px">${d.st==="H"?esc(d.note):d.subj.join(" · ")}</h4><p>${d.st==="H"?"No classes":`${d.subj.length} classes`}</p></div><span class="tag ${lbl[d.st][1]}">${lbl[d.st][0]}</span></div>`).join("")}</div></div>`;
 }},

   ${s.showHint?`<div class="hint"><b style="font-weight:600">Hint:</b> ${esc(q.hint)}</div>`:`<button class="btn light" data-act="dpphint">${svg("bulb")} Show hint</button>`}
   <div class="row" style="gap:10px">${i>0?`<button class="btn light grow" data-act="dppprev">Previous</button>`:""}<button class="btn grow" data-act="dppnext" ${sel===undefined?'aria-disabled="true" style="opacity:.45"':""}>${i===D.qs.length-1?"Submit":"Next"}</button></div>`;

 dppResult:{ title:()=> "DPP result", render(){
  const D=DPP_TODAY, s=state.dpp;

   <div class="sec"><h2>Solutions</h2></div>
   ${D.qs.map((q,i)=>{const ok=s.answers[i]===q.a;return `<div class="card stack-sm"><div class="row" style="justify-content:space-between"><span class="small muted">Q${i+1} · ${esc(q.topic)}</span><span class="tag ${ok?"good":"bad"}">${ok?"Correct":"Incorrect"}</span></div><p style="font-weight:500">${esc(q.q)}</p>
     ${!ok&&s.answers[i]!==undefined?`<div class="opt wrong"><span class="k">${"ABCD"[s.answers[i]]}</span><span class="small">Your answer: ${esc(q.o[s.answers[i]])}</span></div>`:""}
     <div class="opt right"><span class="k">${"ABCD"[q.a]}</span><span class="small">${esc(q.o[q.a])}</span></div>
     <p class="small"><b style="font-weight:600">Solution:</b> ${esc(q.sol)}</p>
     <button class="linkbtn" data-act="askq" data-q="${esc(q.q)}">${svg("spark")} Ask AI to explain</button></div>`}).join("")}
   <button class="btn block" data-tab="dpp">Back to DPP</button>`;
 }},

  const msgs=state.chat.map(m=>m.typing?`<div class="msg ai"><span class="typing"><i></i><i></i><i></i></span></div>`:`<div class="msg ${m.me?"me":"ai"}">${m.me?esc(m.t):m.t.replace(/\n/g,"<br>")}</div>`).join("");
  return `<div class="chat" id="chat"><div class="msg ai">Hi ${STUDENT.first}! 👋 I'm your Veda Vidya AI tutor. Ask me any doubt from your notes or question bank, and I'll guide you with hints step by step.</div>${msgs}</div>

 }, after(){

   <div class="stack-sm">${state.notifs.map(n=>`<button class="notif" data-act="opennotif" data-id="${n.id}"><span class="ic ${tl[n.ic]}">${svg(n.ic)}</span><div class="grow"><h4>${esc(n.t)}</h4><p class="small muted">${esc(n.s)}</p><p class="small muted" style="margin-top:4px;font-size:12.5px">${n.w}</p></div>${n.unread?`<span class="new" aria-label="Unread"></span>`:""}</button>`).join("")}</div>`;

/* ============================== ACTIONS ============================== */
const AI_KEYS = [[/boat|float|sink|upthrust|buoy/i,0],[/least count|spring/i,1],[/friction/i,2],[/3x|solve|equation/i,3],[/combustion|burn|fire/i,4],[/cell/i,5]];
function askAI(text, s, c){
  state.chat.push({me:true,t:text});
  const sub=s&&SUBJECTS.find(x=>x.id===s), ch=sub&&sub.chapters.find(x=>x.n===+c);
  if(ch) return replyAI(`Let's think it through step by step.\n\n<b>Hint 1:</b> This question is from <b>${esc(sub.name)} · Ch ${ch.n} · ${esc(ch.name)}</b>. Start with the key idea: ${esc(ch.points[0])}\n\n<b>Hint 2:</b> ${esc(ch.points[1])}\n\n${ch.formulas.length?`<b>Useful formula:</b> ${esc(ch.formulas[0])}\n\n`:""}Now try writing your answer using these hints. Send it to me and I'll check it.`);
  const k=AI_KEYS.find(([r])=>r.test(text));
  if(k) return replyAI(AI_SUGGEST[k[1]].a.replace(/\n\n📘[\s\S]*$/,""));
  replyAI(`Good question! <b>Hint:</b> First find which chapter this belongs to, then recall its main idea or formula. Write down what is given and what is asked.\n\nTell me the chapter or share what you've tried so far, and I'll guide you to the next step.`);
}
function replyAI(html){
  state.chat.push({typing:true}); if(cur().name==="ai") render(); else nav("ai",{},{root:true});
  setTimeout(()=>{ state.chat=state.chat.filter(m=>!m.typing); state.chat.push({t:html}); if(cur().name==="ai") render(); }, 1100);
}
const ACTIONS = {
  download(t,e){
    e.stopPropagation();
    const k=t.dataset.kind; const label={parent:"Parent Report",faculty:"Faculty Report",wellbeing:"Wellbeing Report",notes:t.dataset.label}[k];
    const target={parent:["parentReport",{id:t.dataset.id}],faculty:["facultyReport",{id:t.dataset.id}],wellbeing:["wellbeing",{}]}[k];
    if(target && cur().name!==target[0]) nav(target[0],target[1]);
    toast(`Preparing ${label} PDF…`); setTimeout(()=>{ try{ window.print(); }catch(err){} }, 400);
  },
  exam(t){ state.examId=t.dataset.id; render(); },
  qbf(t){ state.qbFilter=t.dataset.v; render(); },
  attseg(t){ state.attSeg=t.dataset.v; render(); },
  ttday(t){ state.ttDay=+t.dataset.v; render(); },
  soon(){ toast("Available in the full app"); },
  settings(){ toast("Settings are available in the full app"); },
  dppstart(){ state.dpp={answers:{},i:0,showHint:false,completed:false}; nav("dppQuiz"); },
  dppopt(t){ state.dpp.answers[state.dpp.i]=+t.dataset.v; render(); },
  dpphint(){ state.dpp.showHint=true; render(); },
  dppprev(){ state.dpp.i--; state.dpp.showHint=false; render(); },
  dppnext(){ const s=state.dpp; if(s.answers[s.i]===undefined){ toast("Choose an answer first."); return; }
    if(s.i<DPP_TODAY.qs.length-1){ s.i++; s.showHint=false; render(); window.scrollTo(0,0); return; }
    s.score=DPP_TODAY.qs.reduce((a,q,i)=>a+(s.answers[i]===q.a?1:0),0); s.completed=true;
    if(!DPP_HISTORY.find(h=>h.today)) DPP_HISTORY.unshift({d:"21 Nov",t:DPP_TODAY.title,s:s.score,of:DPP_TODAY.qs.length,done:true,today:true});
    state.stack=[{name:"dpp",params:{}},{name:"dppResult",params:{}}]; render(); window.scrollTo(0,0); toast("DPP submitted"); },
  askq(t){ askAI(t.dataset.q, t.dataset.s, t.dataset.c); },
  readall(){ state.notifs.forEach(n=>n.unread=false); render(); },
  opennotif(t){ const n=state.notifs.find(x=>x.id===+t.dataset.id); n.unread=false; const [name,p]=n.go;
    if(name==="attendance"){ state.attSeg=p.seg||"overview"; return nav("attendance",{},{root:true}); }
    if(["dpp"].includes(name)) return nav(name,{},{root:true});
    nav(name,p); }
};

render();
</script>
